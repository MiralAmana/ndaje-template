<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Invitation — Ndajé</title>
  <meta name="theme-color" content="#7E2236">
  <!-- Aperçu WhatsApp : À CHANGER POUR CHAQUE CLIENT (adresse complète https://…, WhatsApp ne lit pas le JavaScript) -->
  <meta property="og:title" content="Vous êtes invité·e">
  <meta property="og:description" content="Ouvrez l'invitation pour découvrir le programme et confirmer votre présence.">
  <meta property="og:url" content="https://ndaje-template.vercel.app/modeles/union-sacree/">
  <meta property="og:image" content="https://ndaje-template.vercel.app/modeles/union-sacree/assets/apercu-whatsapp.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 0. ENVELOPPE D'OUVERTURE (affichée par app.js ; ?direct=1 la saute) -->
  <div id="enveloppe" class="enveloppe" role="dialog" aria-modal="true" aria-labelledby="env-titre" hidden>
    <div class="enveloppe__fond" aria-hidden="true"></div>
    <div class="enveloppe__scene">
      <img class="enveloppe__bouquet" data-visuel="bouquet" alt="">
      <p class="enveloppe__invite" id="env-titre" data-t="vousEtesInvite"></p>
      <p class="enveloppe__noms" data-noms-courts></p>
      <p class="enveloppe__date" data-date-texte></p>
      <div class="enveloppe__papier" aria-hidden="true">
        <div class="enveloppe__carte"><span class="enveloppe__carte-noms" data-noms-courts></span></div>
        <div class="enveloppe__poche"></div>
        <div class="enveloppe__rabat"></div>
        <div class="sceau"><img data-visuel="monogramme" alt=""><span class="sceau__initiales" data-initiales></span></div>
      </div>
      <button id="ouvrir" class="bouton bouton--plein" type="button" data-t="ouvrir"></button>
    </div>
  </div>

  <!-- 1. BANDEAU + EN-TÊTE --------------------------------------------- -->
  <div class="bandeau" role="note">
    <svg class="ic" aria-hidden="true"><use href="#i-coeur"/></svg>
    <span data-t="bandeau"></span>
    <svg class="ic" aria-hidden="true"><use href="#i-coeur"/></svg>
  </div>
  <header class="entete">
    <div class="marque"><strong>NDAJÉ</strong><span data-t="marque"></span></div>
    <div class="entete__actions">
      <div class="langues" id="langues" role="group" aria-label="Langue"></div>
      <button class="rond" id="musique-btn" type="button" hidden aria-pressed="false">
        <svg class="ic" aria-hidden="true"><use href="#i-musique"/></svg>
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="sr" data-t="musique"></span>
      </button>
    </div>
  </header>

  <main id="contenu">
    <!-- 2. COUVERTURE --------------------------------------------------- -->
    <section class="couverture" id="accueil" aria-labelledby="noms">
      <div class="petales" aria-hidden="true"></div>
      <p class="couverture__surtitre anim" data-t="surtitre"></p>
      <h1 class="couverture__noms anim" id="noms"><span data-nom-a></span> <em>&amp;</em> <span data-nom-b></span></h1>
      <p class="couverture__devise anim" data-t="devise"></p>
      <figure class="couverture__photo anim">
        <img data-visuel="photoCouverture" alt="">
        <div class="couverture__vide" aria-hidden="true"><span data-initiales></span></div>
        <figcaption class="badge-officiel"><svg class="ic" aria-hidden="true"><use href="#i-sceau"/></svg><span data-t="fairePart"></span></figcaption>
      </figure>
      <div class="couverture__actions anim">
        <a class="bouton bouton--plein" href="#rsvp"><svg class="ic" aria-hidden="true"><use href="#i-enveloppe"/></svg><span data-t="confirmer"></span></a>
        <button class="bouton bouton--clair" type="button" id="noter-date"><svg class="ic" aria-hidden="true"><use href="#i-calendrier"/></svg><span data-t="noterDate"></span></button>
        <button class="bouton bouton--rond" type="button" data-partager><svg class="ic ic--wa" aria-hidden="true"><use href="#i-whatsapp"/></svg><span class="sr" data-t="partager"></span></button>
      </div>
    </section>

    <div class="separateur" aria-hidden="true"><span></span></div>

    <!-- PAGE SOUVENIR (X jours après la fête) ------------------------------ -->
    <section class="carte bloc souvenir fleuri" id="souvenir" hidden>
      <h2 class="titre" data-t="souvenirTitre"></h2>
      <p class="texte" data-t="souvenirTexte"></p>
    </section>

    <!-- 3. COMPTE À REBOURS -------------------------------------------- -->
    <section class="carte bloc rebours revele" id="rebours" aria-labelledby="t-rebours">
      <p class="surtitre-or" id="t-rebours" data-t="reboursTitre"></p>
      <h2 class="titre" data-date-texte></h2>
      <div class="rebours__grille" role="timer" aria-live="off">
        <div class="case"><strong id="cr-j">00</strong><span data-t="jours"></span></div>
        <div class="case"><strong id="cr-h">00</strong><span data-t="heures"></span></div>
        <div class="case"><strong id="cr-m">00</strong><span data-t="minutes"></span></div>
        <div class="case case--rose"><strong id="cr-s">00</strong><span data-t="secondes"></span></div>
      </div>
      <p class="citation" data-t="reboursCitation"></p>
    </section>

    <div class="separateur revele" aria-hidden="true"><span></span></div>

    <!-- 4. PROGRAMME ------------------------------------------------------ -->
    <section class="carte bloc revele fleuri" id="programme-section" aria-labelledby="t-programme">
      <p class="pastille" data-t="programmeSurtitre"></p>
      <h2 class="titre titre--filet" id="t-programme" data-t="programme"></h2>
      <ol class="frise" id="programme"></ol>
      <p class="note-bas"><svg class="ic" aria-hidden="true"><use href="#i-horloge"/></svg><span data-t="programmeNote"></span></p>
    </section>

    <div class="separateur revele" aria-hidden="true"><span></span></div>

    <!-- 5. CODE VESTIMENTAIRE --------------------------------------------- -->
    <section class="carte bloc revele" id="dress" aria-labelledby="t-dress" hidden>
      <p class="pastille" data-t="dressSurtitre"></p>
      <h2 class="titre" id="t-dress" data-t="dressTitre"></h2>
      <p class="texte" data-t="dressTexte"></p>
      <ul class="palette" id="palette"></ul>
      <div class="encadre" id="dress-style">
        <p class="encadre__titre"><svg class="ic" aria-hidden="true"><use href="#i-baguette"/></svg><span data-t="styleRecommande"></span></p>
        <p id="dress-texte"></p>
        <p class="interdit" id="dress-interdit"><svg class="ic" aria-hidden="true"><use href="#i-interdit"/></svg><span></span></p>
      </div>
    </section>

    <div class="separateur revele" aria-hidden="true"><span></span></div>

    <!-- 6. LIEU ------------------------------------------------------------- -->
    <section class="carte bloc revele" id="lieu" aria-labelledby="t-lieu" hidden>
      <p class="pastille" data-t="lieuSurtitre"></p>
      <h2 class="titre" id="t-lieu" data-t="lieuTitre"></h2>
      <div class="plan">
        <span class="plan__epingle" aria-hidden="true"><svg class="ic" aria-hidden="true"><use href="#i-epingle"/></svg></span>
        <p class="plan__nom" id="lieu-nom"></p>
        <p class="plan__adresse" id="lieu-adresse"></p>
      </div>
      <div class="plan__boutons">
        <a class="bouton bouton--clair" id="lien-maps" target="_blank" rel="noopener"><svg class="ic ic--maps" aria-hidden="true"><use href="#i-epingle"/></svg><span data-t="ouvrirMaps"></span></a>
        <a class="bouton bouton--clair" id="lien-waze" target="_blank" rel="noopener"><svg class="ic ic--waze" aria-hidden="true"><use href="#i-voiture"/></svg><span data-t="ouvrirWaze"></span></a>
      </div>
      <div class="encadre encadre--info" id="lieu-info-bloc">
        <span class="encadre__p" aria-hidden="true">P</span>
        <p><strong data-t="stationnement"></strong> <span id="lieu-info"></span></p>
      </div>
    </section>

    <div class="separateur revele" aria-hidden="true"><span></span></div>

    <!-- 7. CONFIRMATION DE PRÉSENCE ------------------------------------- -->
    <section class="carte bloc carte--or revele fleuri fleuri--gauche" id="rsvp" aria-labelledby="t-rsvp">
      <p class="pastille pastille--pleine" data-t="presenceSurtitre"></p>
      <h2 class="titre" id="t-rsvp" data-t="presenceTitre"></h2>
      <p class="texte"><span data-t="presenceSousTitre"></span> <strong id="date-limite"></strong>.</p>
      <a class="ligne-rsvp" id="ligne-rsvp" hidden>
        <span data-t="ligneRsvp"></span>
        <strong><svg class="ic" aria-hidden="true"><use href="#i-telephone"/></svg><span id="ligne-rsvp-num"></span></strong>
      </a>
      <form id="formulaire" class="formulaire" novalidate>
        <label class="champ"><span><span data-t="nom"></span> *</span>
          <input name="nom" autocomplete="name" required maxlength="80" data-ph="nomExemple">
        </label>
        <label class="champ"><span><span data-t="telephone"></span> *</span>
          <input name="telephone" type="tel" autocomplete="tel" inputmode="tel" required maxlength="25" data-ph="telephoneExemple">
        </label>
        <fieldset class="champ">
          <legend><span data-t="serezVous"></span> *</legend>
          <div class="choix" id="choix"></div>
        </fieldset>
        <label class="champ" id="champ-nombre"><span data-t="nombre"></span>
          <select name="personnes" id="personnes"></select>
        </label>
        <label class="champ"><span data-t="message"></span>
          <textarea name="message" rows="3" maxlength="400" data-ph="messageExemple"></textarea>
        </label>
        <p class="erreur" id="erreur" role="alert" hidden></p>
        <button class="bouton bouton--plein bouton--large" type="submit"><svg class="ic" aria-hidden="true"><use href="#i-coche"/></svg><span data-t="envoyer"></span></button>
      </form>
      <div class="merci" id="merci" role="status" hidden>
        <span class="merci__icone" aria-hidden="true"><svg class="ic" aria-hidden="true"><use href="#i-coeur"/></svg></span>
        <p id="merci-texte"></p>
      </div>
    </section>

    <div class="separateur revele" aria-hidden="true"><span></span></div>

    <!-- 8. CAGNOTTE ---------------------------------------------------------- -->
    <section class="carte bloc revele" id="cagnotte" aria-labelledby="t-cagnotte" hidden>
      <p class="pastille" data-t="cagnotteSurtitre"></p>
      <h2 class="titre" id="t-cagnotte" data-t="cagnotteTitre"></h2>
      <p class="texte" data-t="cagnotteTexte"></p>
      <div class="moyens" id="moyens"></div>
      <p class="petit" ><span data-t="auNomDe"></span> <strong id="titulaire"></strong></p>
      <p class="petit cagnotte-etranger" data-t="cagnotteEtranger"></p>
      <p class="citation" data-t="cagnotteNote"></p>
    </section>

    <div class="separateur revele" aria-hidden="true"><span></span></div>

    <!-- 9. LIVRE D'OR ---------------------------------------------------------- -->
    <section class="carte bloc revele fleuri" id="livre" aria-labelledby="t-livre" hidden>
      <p class="pastille" data-t="livreSurtitre"></p>
      <h2 class="titre" id="t-livre" data-t="livreTitre"></h2>
      <div class="messages" id="messages"></div>
    </section>
  </main>

  <!-- 10. PIED DE PAGE -------------------------------------------------------- -->
  <footer class="pied">
    <img class="pied__bouquet" data-visuel="bouquetPetit" alt="">
    <img class="pied__photo" data-visuel="photoPied" alt="">
    <p class="pied__noms"><span data-nom-a></span> <em>&amp;</em> <span data-nom-b></span></p>
    <span class="pied__filet" aria-hidden="true"></span>
    <p class="pied__signature" data-t="signature"></p>
    <p class="pied__maison" data-t="maison"></p>
    <p class="pied__droits">© <span id="annee"></span> Ndajé. <span data-t="droits"></span></p>
  </footer>

  <!-- 11. BARRE DU BAS ------------------------------------------------------- -->
  <nav class="barre" aria-label="Navigation de l'invitation">
    <a href="#accueil" data-cible="accueil"><svg class="ic" aria-hidden="true"><use href="#i-coeur"/></svg><span data-t="navAccueil"></span></a>
    <a href="#programme-section" data-cible="programme-section"><svg class="ic" aria-hidden="true"><use href="#i-horloge"/></svg><span data-t="navProgramme"></span></a>
    <a href="#rsvp" data-cible="rsvp" class="barre__rsvp"><svg class="ic" aria-hidden="true"><use href="#i-envoi"/></svg><span data-t="navRsvp"></span></a>
    <a href="#lieu" data-cible="lieu"><svg class="ic" aria-hidden="true"><use href="#i-epingle"/></svg><span data-t="navAcces"></span></a>
    <button type="button" data-partager><svg class="ic ic--wa" aria-hidden="true"><use href="#i-whatsapp"/></svg><span data-t="navPartager"></span></button>
  </nav>
  <div class="avis" id="avis" role="status" hidden></div>
  <audio id="musique" loop preload="none"></audio>

  <!-- Icônes (génériques, réutilisées partout) -->

    <symbol id="i-enveloppe" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 7l9 6 9-6M3 7v11h18V7M3 7l3-3h12l3 3"/></symbol>
    <symbol id="i-calendrier" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4M12 13v4M10 15h4"/></symbol>
    <symbol id="i-whatsapp" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.2A9.7 9.7 0 0 0 3.6 16.8L2.3 21.7l5-1.3A9.7 9.7 0 1 0 12 2.2zm0 17.6c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 19.8zm4.4-6c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8.9c-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.6.3 2.6 2.6 0 0 0-.8 1.9 4.5 4.5 0 0 0 1 2.4 10.3 10.3 0 0 0 4 3.5c1.5.6 2 .7 2.8.6.4-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1l-.3-.2z"/></symbol>

    <symbol id="i-telephone" viewBox="0 0 24 24"><path fill="currentColor" d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></symbol>

    <symbol id="i-mairie" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M4 10h16M12 3l9 7H3l9-7zM6 10v11M10 10v11M14 10v11M18 10v11"/></symbol>

    <symbol id="i-photo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M3 7h4l2-3h6l2 3h4v13H3zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></symbol>
    <symbol id="i-repas" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M16 3c-1.5 1-2 3-2 6h4V3M17 9v12"/></symbol>
    <symbol id="i-soiree" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm11-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></symbol>
  </svg>

  <script src="config.js"></script>
  <script src="../../moteur/moteur.js"></script>
</body>
</html>
